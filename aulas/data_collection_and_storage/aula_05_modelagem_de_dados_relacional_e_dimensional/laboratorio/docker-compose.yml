# Aula 05 · Ambiente local: Postgres (modelo relacional) + MinIO (silver e gold)
# Uso: cp .env.example .env  (troque as senhas)  &&  docker compose up -d
# O Postgres e o MinIO do Railway são os alvos publicados; este arquivo serve para
# desenvolver e testar sem consumir crédito.

services:
  postgres:
    image: postgres:16
    container_name: aula05_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livraria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-livraria}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: aula05_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aula05}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
